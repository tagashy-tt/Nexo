name: Build APK
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.9" }
      - name: Firma estable (si hay secretos)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nexo.jks"
            echo "KS_FILE=$RUNNER_TEMP/nexo.jks" >> "$GITHUB_ENV"
          fi
      - name: Compilar (release = rápida, sin modo debug)
        run: gradle assembleRelease
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - name: Preparar APK
        run: cp app/build/outputs/apk/release/*.apk nexo.apk
      - uses: actions/upload-artifact@v7
        with:
          name: nexo-apk
          path: nexo.apk
      - name: Publicar release (solo al subir una etiqueta vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nexo.apk --title "Nexo $GITHUB_REF_NAME" --generate-notes
